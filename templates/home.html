<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroScan - Plant Disease Recognition</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body>
    <!-- Background Video -->
    <div id="video-background">
      <iframe
        src="https://www.youtube.com/embed/kcfs1-ryKWE?autoplay=1&mute=1&controls=0&loop=1&playlist=kcfs1-ryKWE&showinfo=0&rel=0&iv_load_policy=3&disablekb=1"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen
      ></iframe>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glass-nav">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i
            class="fas fa-leaf text-success me-2"
            style="font-size: 1.5rem"
          ></i>
          <span>AgroScan</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/latest">Latest Analysis</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
      <!-- Hero / Upload Section -->
      <section class="hero-section text-center">
        <div class="container">
          <h1 class="hero-title mb-2">Plant Disease Recognition</h1>
          <p class="hero-subtitle mb-5">
            Detect disease. Protect your crop. Ensure better yield.
          </p>

          <div class="upload-container glass-card fade-in-up">
            <form
              action="/upload/"
              method="POST"
              enctype="multipart/form-data"
              id="uploadForm"
            >
              <div class="upload-area" id="drop-area">
                <div class="icon-container mb-3">
                  <i class="fas fa-cloud-upload-alt fa-3x"></i>
                </div>
                <h3 class="mb-2">Drag & Drop Image Here</h3>
                <p class="text-muted">or click to browse</p>
                <input
                  type="file"
                  name="img"
                  id="fileElem"
                  accept="image/*"
                  class="file-input"
                  required
                  onchange="handleFiles(this.files)"
                />
                <div id="gallery" class="gallery mt-3"></div>
              </div>

              <div class="action-area mt-4">
                <button
                  type="submit"
                  class="btn btn-primary btn-lg custom-btn"
                  id="analyze-btn"
                >
                  <i class="fas fa-search me-2"></i>Analyze Plant
                </button>
              </div>
            </form>

            <!-- Scanning Animation (Hidden by default) -->
            <div id="scanning-overlay" class="scanning-overlay d-none">
              <div class="scanner"></div>
              <p class="mt-3 scanning-text">Analyzing leaf patterns...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inline JS for Drag & Drop and Preview -->
    <script>
      const dropArea = document.getElementById("drop-area");
      const fileInput = document.getElementById("fileElem");
      const gallery = document.getElementById("gallery");
      const uploadForm = document.getElementById("uploadForm");
      const scanningOverlay = document.getElementById("scanning-overlay");
      const analyzeBtn = document.getElementById("analyze-btn");

      // Prevent default drag behaviors
      ["dragenter", "dragover", "dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // Highlight drop area when item is dragged over it
      ["dragenter", "dragover"].forEach((eventName) => {
        dropArea.addEventListener(eventName, highlight, false);
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropArea.addEventListener(eventName, unhighlight, false);
      });

      function highlight(e) {
        dropArea.classList.add("highlight");
      }

      function unhighlight(e) {
        dropArea.classList.remove("highlight");
      }

      // Handle dropped files
      dropArea.addEventListener("drop", handleDrop, false);

      function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        fileInput.files = files; // Update input files
        handleFiles(files);
      }

      function handleFiles(files) {
        files = [...files];
        gallery.innerHTML = ""; // Clear previous preview
        files.forEach(previewFile);
      }

      function previewFile(file) {
        let reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = function () {
          let img = document.createElement("img");
          img.src = reader.result;
          img.classList.add("preview-img");
          gallery.appendChild(img);

          // Hide default icon text if preview exists
          document.querySelector(".icon-container").style.display = "none";
          document.querySelector(".upload-area h3").innerText = file.name;
          document.querySelector(".upload-area p").style.display = "none";
        };
      }

      // Form Submit Animation
      uploadForm.addEventListener("submit", function () {
        scanningOverlay.classList.remove("d-none");
        analyzeBtn.disabled = true;
        analyzeBtn.innerHTML =
          '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Processing...';
      });

      // Trigger file input click when clicking on drop area (but not on input itself)
      dropArea.addEventListener("click", (e) => {
        if (e.target !== fileInput) {
          fileInput.click();
        }
      });
    </script>
  </body>
</html>
